name: Test Übungen

on:
  pull_request:
    paths:
      - "course/02-course-exercises/**.md"
      - "tools/test-uebung.ps1"
      - "tools/test-alle-uebungen.ps1"

jobs:
  test-uebungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Übungen gegen Standard prüfen
        shell: pwsh
        run: .\tools\test-alle-uebungen.ps1
