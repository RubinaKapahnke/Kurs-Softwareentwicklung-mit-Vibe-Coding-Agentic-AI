name: Deploy Onboarding to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/onboarding/**"
      - "course/01-course-modules/01-Onboarding-in-den-Kurs/**"
      - ".github/workflows/deploy-learning-platform-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/onboarding

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/onboarding/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Pages
        run: npm run build:pages

      - name: Verify Pages build output
        run: |
          if [ ! -d "dist/onboarding/browser" ]; then
            echo "Build-Ausgabe fehlt: dist/onboarding/browser"
            exit 1
          fi

      - name: Add SPA fallback page
        run: cp dist/onboarding/browser/index.html dist/onboarding/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/onboarding/dist/onboarding/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
