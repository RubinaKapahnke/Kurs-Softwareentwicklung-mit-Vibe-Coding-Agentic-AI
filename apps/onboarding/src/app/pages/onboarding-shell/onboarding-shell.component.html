<mat-toolbar class="shell-toolbar">
  <span>KnOot Academy Kurs-Tool</span>
  <span class="spacer"></span>
  <a mat-button routerLink="/">Startseite</a>
  <a mat-button href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
</mat-toolbar>

<main class="shell-main">
  <section class="progress-panel" aria-label="Modul-Fortschritt">
    <div class="progress-meta">
      <strong>Fortschritt</strong>
      <span>{{ completedCount() }} von {{ stepCount }} Schritten erledigt</span>
    </div>
    <mat-progress-bar mode="determinate" [value]="progressPercent()"></mat-progress-bar>

    <nav class="step-nav" aria-label="Schrittnavigation">
      @for (stepId of allSteps; track stepId) {
        <a
          mat-mini-fab
          class="step-pill"
          routerLinkActive="step-pill--active"
          [class.step-pill--done]="isStepDone(stepId)"
          [routerLink]="getStepLink(stepId)"
          [attr.aria-label]="(isStepDone(stepId) ? 'Schritt ' + stepId + ' (erledigt)' : 'Zu Schritt ' + stepId)"
          [attr.aria-current]="isCurrentStep(stepId) ? 'step' : null">
          @if (isStepDone(stepId) && !isCurrentStep(stepId)) {
            <mat-icon class="step-check">check</mat-icon>
          } @else {
            {{ stepId }}
          }
        </a>
      }

      <a
        mat-stroked-button
        class="summary-link"
        [routerLink]="summaryLink()"
        routerLinkActive="summary-link--active"
        aria-label="Zur Zusammenfassung">
        <mat-icon>checklist</mat-icon>
        Zusammenfassung
      </a>
    </nav>
  </section>

  <router-outlet></router-outlet>
</main>
