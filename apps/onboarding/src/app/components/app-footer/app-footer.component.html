<footer class="app-footer">
  <div class="footer-container">
    <div class="footer-brand">
      <span class="footer-logo">KnOot Academy</span>
      <span class="footer-copyright">&copy; {{ currentYear }}</span>
    </div>

    <nav class="footer-nav" aria-label="Rechtliche Links">
      @for (link of footerLinks; track link.label) {
        <a [href]="link.href" [target]="link.target" rel="noopener noreferrer" class="footer-link">
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</footer>
