<section class="cta-section">
  <div class="shell cta-inner">
    <div>
      <p class="eyebrow eyebrow--light">Bereit?</p>
      <h2>@if (selectedCourseIsLive()) { Starte jetzt mit dem Setup. } @else { Kursstart folgt nach Freischaltung. }</h2>
    </div>
    <div class="cta-actions">
      @if (selectedCourseIsLive() && voucherValidated()) {
        <a mat-flat-button [routerLink]="resumeLink()" class="btn-resume-cta ui-primary-button-on-dark">
          {{ resumeLabel() }}
        </a>
      } @else if (selectedCourseIsLive()) {
        <a mat-flat-button href="https://www.knoot-academy.de/kontakt" target="_blank" rel="noopener" class="btn-resume-cta btn-resume-cta--testzugang">
          Testzugang anfragen
        </a>
      } @else {
        <a mat-flat-button href="https://www.knoot-academy.de/kontakt" target="_blank" rel="noopener" class="btn-resume-cta ui-primary-button-on-dark">
          Interesse vormerken
        </a>
      }
    </div>
  </div>
</section>
